<div class="row justify-content-center">
  <div class="col-md-12">
    <mat-card>
      <mat-card-header>
        @if (showBackButton) {
          <div mat-card-avatar>
            <button matTooltip="Back" mat-icon-button (click)="back()">
              <mat-icon>arrow_back</mat-icon>
            </button>
          </div>
        }
        <mat-card-title>{{alert.headline}}</mat-card-title>
        <mat-card-subtitle>
          <p style="margin: 20px">Severity: <span [ngClass]="severity">{{alert.severity}}</span></p>
        </mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{alert.description}}</p>
      </mat-card-content>
      <mat-card-footer>
        <b class="m-2">Locations</b>
        <ul class="list-group">
          @for (area of alert.areas; track area) {
            <li class="list-group-item">{{area}}</li>
          }
        </ul>
      </mat-card-footer>
    </mat-card>
  </div>
</div>
