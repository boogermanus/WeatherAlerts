@if (loading) {
  <mat-spinner style="margin: 0 auto;"></mat-spinner>
}
<mat-accordion>
  @for (alert of alerts; track alert) {
    <mat-expansion-panel>
      <mat-expansion-panel-header class="expansionPanel">
        <mat-panel-title>
          {{alert.headline}}
        </mat-panel-title>
      </mat-expansion-panel-header>
      <app-alert-view [alert]="alert" [showBackButton]="false"></app-alert-view>
    </mat-expansion-panel>
  }
</mat-accordion>
